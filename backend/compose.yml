services:
  api:
    build:
      context: .
    image: backend-api:latest
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: