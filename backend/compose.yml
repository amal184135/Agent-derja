services:
  api:
    build:
      context: .
    image: backend-api:latest
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
    volumes:
      - ./models_weights:/code/models_weights
    depends_on:
      - mongo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
